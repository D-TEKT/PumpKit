name: Build PumpKit (macOS VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (Apple Silicon + Intel)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find, sign and zip the plugin
        run: |
          PLUGIN="$(find build -name 'PumpKit.vst3' -type d | head -n 1)"
          echo "Found: $PLUGIN"
          test -n "$PLUGIN"
          codesign --force --deep --sign - "$PLUGIN"
          ditto -c -k --keepParent "$PLUGIN" PumpKit-VST3-macOS.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PumpKit-VST3-macOS
          path: PumpKit-VST3-macOS.zip
